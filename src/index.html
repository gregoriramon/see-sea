<body>
  <app-root>
    <style>
      .seesea-shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#005f73;color:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:0}
      .seesea-shell__title{font-size:3rem;font-weight:700;line-height:1;letter-spacing:1px}
      .seesea-shell__subtitle{font-size:1rem;font-weight:400;margin-top:4px;margin-bottom:24px;opacity:.9}
      .seesea-shell__spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#ffffff;animation:seesea-spin 900ms linear infinite}
      @keyframes seesea-spin{to{transform:rotate(360deg)}}
    </style>
    <div class="seesea-shell" aria-hidden="true">
      <div class="seesea-shell__title">SiSi</div>
      <div class="seesea-shell__subtitle">SeeSea</div>
      <div class="seesea-shell__spinner"></div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
  <script>
    (function () {
      var TIMEOUT_MS = 8000;
      var FLAG = 'seesea-splash-reloaded';
      setTimeout(function () {
        try {
          var root = document.querySelector('app-root');
          if (!root) return;
          if (!root.querySelector('.seesea-shell')) {
            sessionStorage.removeItem(FLAG);
            return;
          }
          if (sessionStorage.getItem(FLAG)) return;
          sessionStorage.setItem(FLAG, '1');
          location.reload();
        } catch (e) { /* noop */ }
      }, TIMEOUT_MS);
    })();
  </script>
